<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Shippori+Mincho:wght@500&display=swap">
<style>
  /* Layout: work mode of the Kyoto Artisan brand. Fixed sand sidebar + linen workspace, dense tables, sans-first (Work Sans), serif only for page titles. Laca = primary action + critical alerts. Charts use the validated pair Ai #2F5E9E / Ocre #B07A3C. Single light theme by design. */
  :root {
    --linen: #F4F0EB; --paper: #FFFFFF; --sand: #ECE5DC; --sand-2: #E3DACD; --line: #DDD5CA;
    --ink: #23211E; --ink-soft: #6A645C; --laca: #A62B2B; --laca-hover: #8F2424; --matcha: #5A6654;
    --ai: #2F5E9E; --ocre: #B07A3C;
    --ok-bg: #E7ECE3; --warn-bg: #F4E7D3; --crit-bg: #F3DEDB; --info-bg: #E3E9F2;
    --font-sans: "Work Sans", "Helvetica Neue", system-ui, sans-serif;
    --font-serif: "Cormorant Garamond", Garamond, "Times New Roman", serif;
    --font-jp: "Shippori Mincho", "Yu Mincho", serif;
    color-scheme: light;
  }
  html, body { background: var(--linen); color: var(--ink); }
  body { font-family: var(--font-sans); font-size: 14px; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--linen); }
  .serif { font-family: var(--font-serif); }
  .jp { font-family: var(--font-jp); }
  .tnum { font-variant-numeric: tabular-nums; }
  h1, h2, h3 { text-wrap: balance; }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  @media (min-width: 1024px) { .gutter { padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
  .fade { animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .slide { animation: slide .3s cubic-bezier(.2,.8,.2,1); }
  @keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  :focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  #root:empty::after { content: "Cargando panel…"; display: block; padding: 48px 16px; color: var(--ink-soft); }
</style>

<div id="root"></div>

const NAMES = ["Mariana López", "Diego Ramírez", "Fernanda Castro", "Luis Ochoa", "Sofía Valdez", "Andrés Peña", "Valeria Quintero", "Jorge Félix", "Camila Rubio", "Ricardo Leyva", "Paola Inzunza", "Héctor Armenta", "Natalia Gastélum", "Iván Beltrán", "Regina Sauceda"];

/* ============ Inventario ============ */
function Inventory({ data, setData, filter, setFilter, importOpen, setImportOpen }) {
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(null);
  const rows = data.inventory.map(r => ({ ...r, avail: r.stock - r.reserved }));
  const match = (r) => filter === "todos" ? true : filter === "alertas" ? r.avail <= FEW : stockState(r.avail) === filter;
  const list = rows.filter(r => match(r) && (!q.trim() || (r.sku + r.piece + TONES[r.tone]).toLowerCase().includes(q.trim().toLowerCase())));
  const totals = { units: rows.reduce((a, b) => a + b.stock, 0), value: rows.reduce((a, b) => a + b.stock * b.cost, 0), out: rows.filter(r => r.avail <= 0).length, few: rows.filter(r => r.avail > 0 && r.avail <= FEW).length };
  const tabs = [["todos", "Todos", rows.length], ["alertas", "Alertas", totals.out + totals.few], ["agotado", "Agotados", totals.out], ["pocos", "Pocos", totals.few], ["ok", "En stock", rows.length - totals.out - totals.few]];
  const selRow = rows.find(r => r.sku === sel);
  const adjust = (sku, type, qty, note) => {
    const sign = type === "Entrada" || type === "Devolución" ? 1 : type === "Conteo físico" ? 0 : -1;
    setData(d => {
      const r = d.inventory.find(x => x.sku === sku);
      const newStock = type === "Conteo físico" ? qty : Math.max(0, r.stock + sign * qty);
      const delta = newStock - r.stock;
      return {
        ...d,

                  <th className="py-2.5 font-medium text-right">Stock</th><th className="py-2.5 font-medium text-right">Apartado</th><th className="py-2.5 font-medium text-right">Disponible</th>

                    <td className="px-5 py-2.5">{r.piece}{r.edition && <span className="ml-1.5 text-[11px] text-inks">ed. {r.edition}</span>}</td>

        {selRow && <StockPanel key={selRow.sku} r={selRow} moves={data.movements.filter(m => m.sku === selRow.sku)} onClose={() => setSel(null)} adjust={adjust} />}
      </div>
      {importOpen && <ImportExcel inventory={data.inventory} onClose={() => setImportOpen(false)} apply={(rows) => {
        setData(d => {
          const map = Object.fromEntries(rows.map(r => [r.sku, r.stock]));
          const moves = rows.map(r => { const cur = d.inventory.find(x => x.sku === r.sku); return { sku: r.sku, type: "Inventario inicial", qty: r.stock - cur.stock, date: new Date(), user: "Aiko M.", note: "Importado desde Excel", balance: r.stock }; });
          return { ...d, inventory: d.inventory.map(x => x.sku in map ? { ...x, stock: map[x.sku] } : x), movements: [...moves, ...d.movements] };
        });
      }} />}
    </div>
  );
}

function StockPanel({ r, moves, onClose, adjust }) {
  const [type, setType] = useState("Entrada");
  const [qty, setQty] = useState("");
  const [note, setNote] = useState("");
  const [err, setErr] = useState("");
  const [done, setDone] = useState("");
  const closeRef = useRef(null);
  useEffect(() => { closeRef.current?.focus(); const k = e => e.key === "Escape" && onClose(); window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, []);
  const submit = (e) => {
    e.preventDefault();
    const n = parseInt(qty, 10);
    if (!Number.isFinite(n) || n < 0 || (type !== "Conteo físico" && n === 0)) { setErr(type === "Conteo físico" ? "Escriba cuántos pares contó (0 o más)." : "Escriba una cantidad mayor a 0."); return; }
    if ((type === "Merma" || type === "Salida") && n > r.stock) { setErr(`No puede sacar más de ${r.stock} pares.`); return; }
    if (type !== "Entrada" && type !== "Conteo físico" && !note.trim()) { setErr("Escriba el motivo para la bitácora."); return; }
    adjust(r.sku, type, n, note.trim()); setDone(`${type} registrada`); setQty(""); setNote(""); setErr("");
    setTimeout(() => setDone(""), 2200);
  };
  return (
    <>
      <div className="fixed inset-0 bg-ink/30 z-40 2xl:hidden" onClick={onClose} aria-hidden="true" />
      <aside role="dialog" aria-label={`Inventario de ${r.sku}`} className="slide fixed 2xl:static inset-y-0 right-0 z-50 w-full sm:w-[420px] 2xl:w-auto bg-paper border-l 2xl:border border-line 2xl:rounded-lg overflow-y-auto 2xl:max-h-[calc(100vh-150px)] 2xl:sticky 2xl:top-[88px]"
        style={{ paddingTop: "env(safe-area-inset-top, 0px)", paddingBottom: "env(safe-area-inset-bottom, 0px)" }}>
        <div className="sticky top-0 bg-paper border-b border-line px-5 py-4 flex items-start justify-between gap-3 z-10">
          <div className="min-w-0">
            <p className="text-[12px] text-inks tnum">{r.sku}</p>
            <h2 className="text-[17px] font-semibold">{r.piece}</h2>
            <p className="text-[12.5px] text-inks">{TONES[r.tone]} · Talla {r.size}</p>
          </div>
          <button ref={closeRef} onClick={onClose} aria-label="Cerrar" className="w-10 h-10 -mr-2 rounded-md hover:bg-sand flex items-center justify-center"><Ico d={I.x} /></button>
        </div>
        <div className="px-5 py-5 space-y-6">
          <dl className="grid grid-cols-3 rounded-lg border border-line divide-x divide-line text-center">
            {[["Stock", r.stock], ["Apartado", r.reserved], ["Disponible", r.avail]].map(([k, v]) => <div key={k} className="py-3"><dt className="text-[12px] text-inks">{k}</dt><dd className={`text-[22px] font-semibold tnum ${k === "Disponible" && v <= 0 ? "text-laca" : ""}`}>{v}</dd></div>)}
          </dl>

          <form onSubmit={submit} noValidate className="rounded-lg bg-linen border border-line p-4 space-y-3">
            <p className="text-[13.5px] font-medium">Registrar movimiento</p>
            <div className="grid grid-cols-2 gap-1" role="radiogroup" aria-label="Tipo de movimiento">
              {["Entrada", "Merma", "Devolución", "Conteo físico"].map(t => (
                <button type="button" key={t} role="radio" aria-checked={type === t} onClick={() => { setType(t); setErr(""); }}
                  className={`h-9 rounded-md text-[12.5px] border ${type === t ? "bg-ink text-linen border-ink" : "bg-paper border-line hover:bg-sand"}`}>{t}</button>
              ))}
            </div>
            <div>
              <label htmlFor="adj-qty" className="text-[12px] text-inks">{type === "Conteo físico" ? "Pares contados en anaquel" : "Cantidad de pares"}</label>
              <input id="adj-qty" inputMode="numeric" value={qty} onChange={e => { setQty(e.target.value.replace(/\D/g, "")); setErr(""); }} className="mt-1 h-10 w-full rounded-md border border-line bg-paper px-3 text-[14px] tnum outline-none focus:border-ai" />
              {type === "Conteo físico" && qty !== "" && <p className="text-[12px] text-inks mt-1 tnum">Diferencia contra sistema: {parseInt(qty, 10) - r.stock > 0 ? "+" : ""}{parseInt(qty, 10) - r.stock} pares</p>}
            </div>
            <div>
              <label htmlFor="adj-note" className="text-[12px] text-inks">Motivo {type === "Entrada" || type === "Conteo físico" ? "(opcional)" : ""}</label>
              <input id="adj-note" value={note} onChange={e => { setNote(e.target.value); setErr(""); }} placeholder={type === "Entrada" ? "Lote maquila noviembre" : type === "Merma" ? "Hilo jalado, mancha…" : "Cambio de talla, pedido SKK-…"} className="mt-1 h-10 w-full rounded-md border border-line bg-paper px-3 text-[13px] outline-none focus:border-ai" />
            </div>
            {err && <p className="text-[12.5px] text-laca" role="alert">{err}</p>}
            <div className="flex items-center gap-3">
              <Btn type="submit" variant="dark"><Ico d={I.check} className="w-4 h-4" />Registrar</Btn>
              {done && <span className="text-[12.5px] text-matcha fade" role="status">{done}</span>}
            </div>
          </form>

          <section>
            <h3 className="text-[12px] uppercase tracking-[.12em] text-inks mb-2">Kárdex</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-[12.5px] min-w-[340px]">
                <thead className="text-inks text-left"><tr><th className="py-1.5 font-medium">Fecha</th><th className="py-1.5 font-medium">Movimiento</th><th className="py-1.5 font-medium text-right">Cant.</th><th className="py-1.5 font-medium text-right">Saldo</th></tr></thead>
                <tbody className="divide-y divide-line border-t border-line">
                  {moves.map((m, i) => (
                    <tr key={i} className={i === 0 && done ? "bg-okbg" : ""}>
                      <td className="py-2 text-inks whitespace-nowrap">{fmtDate(m.date)}</td>
                      <td className="py-2"><span className="block">{m.type}</span><span className="block text-[11.5px] text-inks">{m.note} · {m.user}</span></td>
                      <td className={`py-2 text-right tnum font-medium ${m.qty > 0 ? "text-matcha" : m.qty < 0 ? "text-laca" : "text-inks"}`}>{m.qty > 0 ? "+" : ""}{m.qty}</td>
                      <td className="py-2 text-right tnum">{m.balance}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </aside>
    </>
  );
}

function ImportExcel({ inventory, onClose, apply }) {
  const [file, setFile] = useState(null);
  const [done, setDone] = useState(false);
  const preview = useMemo(() => {
    if (!file) return [];
    const ok = inventory.slice(0, 40).map((r, i) => ({ sku: r.sku, piece: r.piece, size: r.size, stock: (r.stock + 3 + i) % 26, error: "" }));
    return [...ok,
      { sku: "SKK-099-AZU-M", piece: "Modelo desconocido", size: "M", stock: 10, error: "El SKU no existe en el catálogo" },
      { sku: inventory[5].sku, piece: inventory[5].piece, size: inventory[5].size, stock: -2, error: "El stock no puede ser negativo" }];
  }, [file]);
  const valid = preview.filter(r => !r.error), invalid = preview.filter(r => r.error);
  const closeRef = useRef(null);
  useEffect(() => { closeRef.current?.focus(); const k = e => e.key === "Escape" && onClose(); window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, []);
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center gutter py-6" role="dialog" aria-modal="true" aria-labelledby="imp-title">
      <div className="absolute inset-0 bg-ink/40" onClick={onClose} aria-hidden="true" />
      <div className="relative w-full max-w-2xl max-h-full overflow-y-auto bg-paper rounded-lg border border-line shadow-xl fade">
        <div className="sticky top-0 bg-paper border-b border-line px-5 py-4 flex items-start justify-between gap-3">
          <div><h2 id="imp-title" className="text-[17px] font-semibold">Importar inventario desde Excel</h2><p className="text-[12.5px] text-inks mt-0.5">Pasa el control actual del cliente al panel en una sola carga.</p></div>
          <button ref={closeRef} onClick={onClose} aria-label="Cerrar" className="w-10 h-10 -mr-2 rounded-md hover:bg-sand flex items-center justify-center"><Ico d={I.x} /></button>
        </div>
        <div className="px-5 py-5 space-y-5">
          {done ? (
            <div className="rounded-lg bg-okbg p-5 fade" role="status">
              <p className="text-[15px] font-semibold flex items-center gap-2"><Ico d={I.check} />{valid.length} SKU actualizados</p>
              <p className="text-[13px] mt-1">Cada uno quedó en el kárdex como “Inventario inicial · Importado desde Excel”. {invalid.length} filas se omitieron por errores.</p>
              <Btn variant="dark" className="mt-4" onClick={onClose}>Ver inventario</Btn>
            </div>
          ) : (
            <>
              <p className="text-[13px]"><b className="font-semibold">1.</b> El archivo necesita estas columnas, en este orden (en el panel real se descarga una plantilla):</p>
              <div className="overflow-x-auto rounded-md border border-line">
                <table className="w-full text-[12.5px] min-w-[460px]">
                  <thead className="bg-linen text-inks"><tr>{["SKU", "Pieza", "Tono", "Talla", "Stock"].map(h => <th key={h} className="text-left px-3 py-2 font-medium">{h}</th>)}</tr></thead>
                  <tbody><tr className="tnum"><td className="px-3 py-2">SKK-007-SUM-M</td><td className="px-3 py-2">Tabi Origami Noche</td><td className="px-3 py-2">Tinta Sumi</td><td className="px-3 py-2">M</td><td className="px-3 py-2">12</td></tr></tbody>
                </table>
              </div>
              <div>
                <p className="text-[13px]"><b className="font-semibold">2.</b> Elija el archivo (.xlsx o .csv):</p>
                <label htmlFor="imp-file" className="mt-2 flex flex-col items-center justify-center gap-2 rounded-lg border-2 border-dashed border-line bg-linen hover:bg-sand px-4 py-7 cursor-pointer text-center">
                  <Ico d={I.inv} className="w-6 h-6 text-inks" />
                  <span className="text-[13.5px] font-medium">{file ? file.name : "Haga clic para elegir el archivo"}</span>
                  <span className="text-[12px] text-inks">En este mockup la vista previa usa datos de ejemplo</span>
                </label>
                <input id="imp-file" type="file" accept=".xlsx,.xls,.csv" className="sr-only" onChange={e => setFile(e.target.files?.[0] || null)} />
                {!file && <button type="button" onClick={() => setFile({ name: "inventario-sokko-octubre.xlsx" })} className="mt-2 text-[12.5px] text-ai hover:underline">Probar con un archivo de ejemplo</button>}
              </div>
              {file && (
                <div className="fade">
                  <p className="text-[13px]"><b className="font-semibold">3.</b> Revise antes de aplicar: <span className="text-matcha font-medium">{valid.length} filas válidas</span> · <span className="text-laca font-medium">{invalid.length} con error</span></p>
                  <div className="mt-2 overflow-x-auto rounded-md border border-line max-h-56 overflow-y-auto">
                    <table className="w-full text-[12.5px] min-w-[520px]">
                      <tbody className="divide-y divide-line">
                        {[...invalid, ...valid.slice(0, 6)].map((r, i) => (
                          <tr key={i} className={r.error ? "bg-critbg/60" : ""}>
                            <td className="px-3 py-2 tnum">{r.sku}</td><td className="px-3 py-2">{r.piece}</td><td className="px-3 py-2">{r.size}</td><td className="px-3 py-2 tnum text-right">{r.stock}</td>
                            <td className="px-3 py-2 text-[12px]">{r.error ? <span className="text-laca">{r.error}</span> : <span className="text-matcha">Lista</span>}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                  <p className="text-[12px] text-inks mt-2">Las filas con error se omiten; corríjalas en el Excel y vuelva a importar solo esas.</p>
                  <div className="flex flex-wrap gap-2 mt-4">
                    <Btn onClick={() => { apply(valid); setDone(true); }}><Ico d={I.check} className="w-4 h-4" />Aplicar {valid.length} filas</Btn>
                    <Btn variant="outline" onClick={() => setFile(null)}>Elegir otro archivo</Btn>
                  </div>
                </div>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

        <CardHead title="Usuarios internos" sub="Solo el Dueño da de alta y cambia roles" right={<Btn variant="outline" size="sm"><Ico d={I.plus} className="w-4 h-4" />Invitar</Btn>} />
        <ul className="border-t border-line divide-y divide-line">
          {[["Aiko Morales", "hola@sokko.mx", "Dueño"], ["Daniel Ruiz", "daniel@sokko.mx", "Operaciones"], ["Kevin Armenta", "kevin@sokko.mx", "Operaciones"]].map(([n, e, r]) => (
            <li key={e} className="px-5 py-3 flex items-center gap-3">
              <span className="w-8 h-8 rounded-full bg-sand text-[12px] font-semibold flex items-center justify-center">{n.split(" ").map(x => x[0]).join("")}</span>
              <span className="min-w-0 flex-1"><span className="block text-[13.5px]">{n}</span><span className="block text-[12px] text-inks truncate">{e}</span></span>
              <span className={`text-[12px] rounded-full px-2.5 py-0.5 ${r === "Dueño" ? "bg-ink text-linen" : "bg-infobg text-[#22487A]"}`}>{r}</span>
            </li>
          ))}
        </ul>
      </Card>
      <div className="xl:col-span-2 flex flex-wrap items-center gap-3">
        <Btn onClick={() => setSaved(true)}><Ico d={I.check} className="w-4 h-4" />Guardar cambios</Btn>
        {saved && <span className="text-[13px] text-matcha fade" role="status">Cambios guardados. La tienda los toma de GET /api/config.</span>}
      </div>
    </div>
  );
}

/* ============ Placeholder ============ */
function Soon({ title, items }) {
  return (
    <Card className="px-6 py-12 text-center fade">
      <p className="jp text-[44px] text-ink/15 leading-none" aria-hidden="true">準備</p>
      <h2 className="text-[17px] font-semibold mt-3">{title} llega en la siguiente iteración</h2>
      <ul className="mt-4 inline-flex flex-col gap-1.5 text-left text-[13px] text-inks">{items.map(i => <li key={i} className="flex gap-2"><span aria-hidden="true">·</span>{i}</li>)}</ul>
    </Card>
  );
}

/* ============ Shell ============ */
const ROLES = { dueno: { label: "Dueño", name: "Aiko Morales", ini: "AM" }, operaciones: { label: "Operaciones", name: "Daniel Ruiz", ini: "DR" } };
const NAV = [
  { k: "dashboard", l: "Dashboard", i: I.dash, roles: ["dueno", "operaciones"] },
  { k: "pedidos", l: "Pedidos", i: I.orders, roles: ["dueno", "operaciones"] },
  { k: "inventario", l: "Inventario", i: I.inv, roles: ["dueno", "operaciones"] },
  { k: "catalogo", l: "Catálogo", i: I.cat, roles: ["dueno"] },
  { k: "clientes", l: "Clientes", i: I.users, roles: ["dueno"] },
  { k: "finanzas", l: "Finanzas", i: I.money, roles: ["dueno"] },
  { k: "envios", l: "Envíos", i: I.truck, roles: ["dueno", "operaciones"] },
  { k: "promociones", l: "Promociones", i: I.tag, roles: ["dueno"] },
  { k: "config", l: "Configuración", i: I.gear, roles: ["dueno"] },
];
const SOON = {
  catalogo: ["Alta de piezas con variantes tono × talla y SKU", "Fotos, material, edición limitada y costo (opcional)", "Publicar u ocultar en la tienda"],
  clientes: ["Historial de compras por cliente", "Talla preferida y consentimiento de correos", "Clientes recurrentes y valor de vida"],
  finanzas: ["Ventas, IVA y envíos cobrados por periodo", "Exportación mensual a Excel para el contador externo", "Margen y utilidad cuando se capture el costo por par"],
  envios: ["Guías Estafeta / DHL y rutas de entrega local", "Costo real contra costo cobrado", "Pedidos atrasados por paquetería o repartidor"],
  promociones: ["Cupones con vigencia", "Packs y precios especiales"],
};

function App() {
  const [data, setData] = useState(INIT);
  const [page, setPage] = useState("dashboard");
  const [range, setRange] = useState("hoy");
  const [orderFilter, setOrderFilter] = useState("todos");
  const [invFilter, setInvFilter] = useState("todos");
  const [openOrder, setOpenOrder] = useState(null);
  const [role, setRole] = useState("dueno");
  const [menu, setMenu] = useState(false);
  const [roleMenu, setRoleMenu] = useState(false);
  const [importOpen, setImportOpen] = useState(false);
  const go = (p, f, id) => {
    setPage(p); setMenu(false);
    if (p === "pedidos") { setOrderFilter(f || "todos"); setOpenOrder(id || null); }
    if (p === "inventario") setInvFilter(f || "todos");
    window.scrollTo({ top: 0 });
  };
  const nav = NAV.filter(n => n.roles.includes(role));
  useEffect(() => { if (!nav.find(n => n.k === page)) setPage("dashboard"); }, [role]);
  const lateCount = data.orders.filter(isLate).length;
  const toPrep = data.orders.filter(o => o.status === "por_preparar").length;
  const title = { dashboard: "Buenos días, " + ROLES[role].name.split(" ")[0], pedidos: "Pedidos", inventario: "Inventario" }[page] || NAV.find(n => n.k === page)?.l;
  const sub = { dashboard: "Domingo 18 de octubre de 2026 · datos de ejemplo", pedidos: "Surta, envíe y dé seguimiento: paquetería y entrega local", inventario: "Stock por SKU y bitácora de movimientos", config: "Reglas de envío, zona local, inventario y usuarios" }[page] || "";

  const Sidebar = (
    <nav aria-label="Secciones del panel" className="flex flex-col h-full">
      <div className="px-5 h-16 flex items-center border-b border-line">
        <img src={LOGO_H} alt="SOKKO" className="h-9 w-auto" draggable="false" />
        <span className="ml-auto text-[10.5px] tracking-[.14em] uppercase text-inks bg-paper border border-line rounded px-1.5 py-0.5">Admin</span>
      </div>
      <ul className="p-3 space-y-0.5 flex-1">
        {nav.map(n => (
          <li key={n.k}>
            <button onClick={() => go(n.k)} aria-current={page === n.k ? "page" : undefined}
              className={`w-full h-10 px-3 rounded-md flex items-center gap-3 text-[13.5px] transition-colors ${page === n.k ? "bg-paper text-ink font-medium border border-line" : "text-inks hover:text-ink hover:bg-sand2/60 border border-transparent"}`}>
              <Ico d={n.i} />{n.l}
              {n.k === "pedidos" && toPrep > 0 && <span className="ml-auto tnum text-[11.5px] rounded-full bg-ocre text-white px-2 py-0.5">{toPrep}</span>}
              {!["dashboard", "pedidos", "inventario", "config"].includes(n.k) && <span className="ml-auto text-[10.5px] text-inks/80">Pronto</span>}
            </button>
          </li>
        ))}
      </ul>
      <div className="p-3 border-t border-line">
        <a href="#" className="h-10 px-3 rounded-md flex items-center gap-3 text-[13px] text-inks hover:text-ink hover:bg-sand2/60"><Ico d={I.ext} />Ver tienda</a>
      </div>
    </nav>
  );

  return (
    <div className="min-h-screen lg:grid lg:grid-cols-[248px_minmax(0,1fr)]">
      <aside className="hidden lg:block bg-sand border-r border-line sticky top-0 h-screen" style={{ paddingTop: "env(safe-area-inset-top, 0px)" }}>{Sidebar}</aside>
      {menu && (
        <div className="lg:hidden fixed inset-0 z-50">
          <div className="absolute inset-0 bg-ink/30" onClick={() => setMenu(false)} />
          <aside className="slide absolute inset-y-0 left-0 w-[260px] bg-sand border-r border-line" style={{ paddingTop: "env(safe-area-inset-top, 0px)" }}>{Sidebar}</aside>
        </div>
      )}

      <div className="min-w-0">
        <header className="sticky z-30 bg-linen/95 backdrop-blur border-b border-line" style={{ top: "env(safe-area-inset-top, 0px)" }}>
          <div className="gutter h-16 flex items-center gap-3">
            <button className="lg:hidden w-10 h-10 -ml-2 rounded-md hover:bg-sand flex items-center justify-center" onClick={() => setMenu(true)} aria-label="Abrir menú"><Ico d={I.menu} /></button>
            <img src={LOGO_ISO} alt="SOKKO" className="lg:hidden h-8 w-auto" />
            <label className="hidden md:flex items-center gap-2 h-9 px-3 rounded-md border border-line bg-paper w-72">
              <Ico d={I.search} className="w-4 h-4 text-inks" />
              <input id="global-q" placeholder="Buscar pedido, SKU o cliente" className="bg-transparent outline-none w-full text-[13px]" onKeyDown={e => { if (e.key === "Enter") go("pedidos", "todos"); }} />
            </label>
            <div className="ml-auto flex items-center gap-1">
              <button onClick={() => go("pedidos", "late")} className="relative w-10 h-10 rounded-md hover:bg-sand flex items-center justify-center" aria-label={`${lateCount} pedidos atrasados`}>
                <Ico d={I.bell} />{lateCount > 0 && <span className="absolute top-1.5 right-1.5 min-w-[17px] h-[17px] px-1 rounded-full bg-laca text-white text-[10.5px] font-semibold flex items-center justify-center tnum">{lateCount}</span>}
              </button>
              <div className="relative">
                <button onClick={() => setRoleMenu(m => !m)} aria-haspopup="menu" aria-expanded={roleMenu} className="h-10 pl-1.5 pr-2.5 rounded-md hover:bg-sand flex items-center gap-2.5">
                  <span className="w-8 h-8 rounded-full bg-ink text-linen text-[12px] font-semibold flex items-center justify-center">{ROLES[role].ini}</span>
                  <span className="hidden sm:block text-left leading-tight"><span className="block text-[13px] font-medium">{ROLES[role].name}</span><span className="block text-[11.5px] text-inks">{ROLES[role].label}</span></span>
                  <Ico d={I.down} className="w-4 h-4 text-inks" />
                </button>
                {roleMenu && (
                  <div role="menu" className="fade absolute right-0 mt-1 w-64 bg-paper border border-line rounded-lg shadow-lg py-1.5 z-50">
                    <p className="px-3 py-1.5 text-[11.5px] text-inks">Demo: ver el panel como…</p>
                    {Object.entries(ROLES).map(([k, r]) => (
                      <button key={k} role="menuitemradio" aria-checked={role === k} onClick={() => { setRole(k); setRoleMenu(false); }} className="w-full px-3 py-2 text-left text-[13px] hover:bg-linen flex items-center gap-2">
                        <span className="w-4">{role === k && <Ico d={I.check} className="w-4 h-4 text-ai" />}</span>{r.label}<span className="ml-auto text-[11.5px] text-inks">{r.name}</span>
                      </button>
                    ))}
                    <div className="border-t border-line my-1" />
                    <button role="menuitem" className="w-full px-3 py-2 text-left text-[13px] hover:bg-linen text-laca" onClick={() => setRoleMenu(false)}>Cerrar sesión</button>
                  </div>
                )}
              </div>
            </div>
          </div>
        </header>

        <main className="gutter py-6 lg:py-8 max-w-[1600px]">
          <div className="flex flex-wrap items-end justify-between gap-4 mb-6">
            <div>
              <h1 className="serif text-[clamp(28px,3vw,36px)] leading-tight">{title}</h1>
              {sub && <p className="text-[13px] text-inks mt-1">{sub}</p>}
            </div>
            {page === "dashboard" && (
              <div className="inline-flex rounded-md border border-line bg-paper p-0.5" role="radiogroup" aria-label="Periodo">
                {[["hoy", "Hoy"], ["7d", "7 días"], ["30d", "30 días"]].map(([k, l]) => (
                  <button key={k} role="radio" aria-checked={range === k} onClick={() => setRange(k)} className={`h-8 px-3 rounded text-[13px] ${range === k ? "bg-ink text-linen" : "hover:bg-sand"}`}>{l}</button>
                ))}
              </div>
            )}
            {page === "inventario" && role === "dueno" && <Btn variant="dark" onClick={() => setImportOpen(true)}><Ico d={I.plus} className="w-4 h-4" />Importar desde Excel</Btn>}
          </div>

          {page === "dashboard" && <Dashboard data={data} range={range} go={go} role={role} />}
          {page === "pedidos" && <Orders data={data} setData={setData} filter={orderFilter} setFilter={setOrderFilter} openId={openOrder} setOpenId={setOpenOrder} role={role} />}
          {page === "inventario" && <Inventory data={data} setData={setData} filter={invFilter} setFilter={setInvFilter} importOpen={importOpen} setImportOpen={setImportOpen} />}
          {page === "config" && <Settings />}
          {SOON[page] && page !== "config" && <Soon title={NAV.find(n => n.k === page).l} items={SOON[page]} />}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</html>
