<title>SOKKO Tienda Multilínea</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Work+Sans:wght@300;400;500;600&family=Shippori+Mincho:wght@400;600&display=swap">
<style>
  /* Layout: one linen shop, four rooms. SOKKO Japón keeps the gallery-wall treatment (serif, kanji, generous air);
     Marcas / Especiales / Accesorios use the same grid and tokens in a quieter Work Sans register.
     Single linen theme by design, matching the Kyoto Artisan system already in production. */
  :root {
    --linen: #F4F0EB;
    --sand: #ECE5DC;
    --sand-2: #E3DACD;
    --ink: #23211E;
    --ink-soft: #6A645C;
    --laca: #A62B2B;
    --laca-hover: #8F2424;
    --matcha: #5A6654;
    --moss: #8F9779;
    --ocre: #B07A3C;
    --ocre-ink: #85571F; /* ocre oscurecido para texto y fondos con texto (AA sobre linen) */
    --white: #FFFDF9;
    --font-serif: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
    --font-sans: "Work Sans", "Helvetica Neue", system-ui, sans-serif;
    --font-jp: "Shippori Mincho", "Yu Mincho", "Hiragino Mincho ProN", serif;
    color-scheme: light;
  }
  html, body { background: var(--linen); color: var(--ink); }
  body { font-family: var(--font-sans); font-weight: 300; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--linen); }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  @media (min-width: 768px) { .gutter { padding-left: max(48px, env(safe-area-inset-left, 0px)); padding-right: max(48px, env(safe-area-inset-right, 0px)); } }
  .serif { font-family: var(--font-serif); }
  .jp { font-family: var(--font-jp); }
  .vertical { writing-mode: vertical-rl; text-orientation: upright; }
  .tnum { font-variant-numeric: tabular-nums; }
  h1, h2, h3 { text-wrap: balance; }
  .eyebrow { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-soft); font-weight: 400; }
  .linen-tex { background-image: repeating-linear-gradient(0deg, rgba(35,33,30,.018) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(35,33,30,.014) 0 1px, transparent 1px 4px); }
  .hairline { border-color: rgba(35,33,30,.14); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 22px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 400; transition: background .2s, color .2s, border-color .2s; }
  .btn-laca { background: var(--laca); color: var(--white); }
  .btn-laca:hover { background: var(--laca-hover); }
  .btn-ghost { border: 1px solid var(--ink); color: var(--ink); }
  .btn-ghost:hover { background: var(--ink); color: var(--linen); }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border: 1px solid rgba(35,33,30,.22); font-size: 13px; color: var(--ink); background: transparent; transition: background .15s, border-color .15s; white-space: nowrap; }
  .chip:hover { border-color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--linen); border-color: var(--ink); }
  .navlink { position: relative; padding: 10px 0; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; }
  .navlink:hover, .navlink[aria-current="page"] { color: var(--ink); }
  .navlink[aria-current="page"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 2px; height: 1px; background: var(--ink); }
  .tag { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 500; }
  .tag-off { background: var(--ocre-ink); color: var(--white); }
  .tag-season { border: 1px solid var(--matcha); color: var(--matcha); }
  .tag-few { color: var(--laca); padding: 0; height: auto; line-height: 1; }
  .fade { animation: fade .45s ease both; }
  @keyframes fade { from { opacity: .001; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .toast { animation: toast .35s cubic-bezier(.2,1.2,.4,1) both; }
  @keyframes toast { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  :focus-visible { outline: 1px solid var(--laca); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  .scroll-x { overflow-x: auto; scrollbar-width: none; }
  .scroll-x::-webkit-scrollbar { display: none; }
  #root:empty::after { content: "Abriendo la tienda…"; display: block; padding: 48px 16px; font-family: var(--font-serif); font-size: 20px; color: var(--ink-soft); }
</style>

function pricing(p, date) {
  const c = COLLECTIONS[p.collection];
  const off = c && c.kind === "temporada" && !inSeason(c, date);
  const price = off ? Math.round(p.price * (1 - c.off) * 100) / 100 : p.price;
  return { off, price, pct: off ? Math.round(c.off * 100) : 0 };
}
const visible = (p, date) => inSeason(COLLECTIONS[p.collection], date);
function unitLabel(p) {
  if (p.pack) return `Paquete de ${p.pack} pares`;
  return p.type === "calcetas" ? "Par" : "Pieza";
}
const fmtWindow = (c) => {
  const M = ["", "ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  return `${c.start[1]} ${M[c.start[0]]} – ${c.end[1]} ${M[c.end[0]]}`;
};

/* ---------------- Ilustraciones ---------------- */
function Knit({ id, hex, line = "#F4F0EB" }) {
  return (
    <pattern id={id} width="7" height="6" patternUnits="userSpaceOnUse">
      <rect width="7" height="6" fill={hex} />
      <path d="M0.5 0.5 L3.5 5 L6.5 0.5" fill="none" stroke={line} strokeOpacity=".16" strokeWidth=".8" />
    </pattern>
  );
}
const lightOf = (hex) => (["#EFE8DC", "#F7F5F1", "#E3B53B", "#A7A39C", "#B08A63"].includes(hex) ? "#23211E" : "#F4F0EB");

function Tabi({ hex }) {
  const uid = useMemo(() => Math.random().toString(36).slice(2, 8), []);
  const D = "M84 22 H142 V118 C142 146 150 166 162 180 C178 198 172 226 146 228 H62 C40 228 30 214 33 199 C36 188 47 183 58 181 L70 177 C82 168 84 148 84 128 Z";
  return (
    <g>
      <defs><Knit id={`k${uid}`} hex={hex} line={lightOf(hex)} /><clipPath id={`c${uid}`}><path d={D} /></clipPath></defs>
      <g clipPath={`url(#c${uid})`}>
        <rect width="220" height="250" fill={`url(#k${uid})`} />
        <rect x="80" y="18" width="70" height="24" fill="rgba(0,0,0,.07)" />
        {[0, 1, 2, 3, 4].map((i) => <line key={i} x1={88 + i * 12} y1="20" x2={88 + i * 12} y2="42" stroke={lightOf(hex)} strokeOpacity=".22" strokeWidth="1.2" />)}
      </g>
      <path d={D} fill="none" stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round" />
      <path d="M58 186 C66 196 66 214 56 227" fill="none" stroke="var(--ink)" strokeWidth="2" strokeLinecap="round" />
    </g>
  );
}

const CREW_D = "M78 20 H138 V138 C138 158 146 170 160 180 C180 194 178 226 150 228 H70 C46 228 40 206 50 192 C58 182 72 176 78 160 Z";
function Crew({ hex, stripe, dx = 0, dy = 0, motif }) {
  const uid = useMemo(() => Math.random().toString(36).slice(2, 8), []);
  return (
    <g transform={`translate(${dx} ${dy})`}>
      <defs><Knit id={`k${uid}`} hex={hex} line={lightOf(hex)} /><clipPath id={`c${uid}`}><path d={CREW_D} /></clipPath></defs>
      <g clipPath={`url(#c${uid})`}>
        <rect width="220" height="250" fill={`url(#k${uid})`} />
        <rect x="70" y="18" width="80" height="22" fill="rgba(0,0,0,.08)" />
        {stripe && <><rect x="70" y="48" width="80" height="5" fill={stripe} /><rect x="70" y="58" width="80" height="5" fill={stripe} /></>}
        <path d="M140 196 C150 192 166 198 176 208 L176 240 L130 240 Z" fill="rgba(0,0,0,.09)" />
        <path d="M48 196 C56 188 70 190 80 200 L80 240 L40 240 Z" fill="rgba(0,0,0,.09)" />
        {motif}
      </g>
      <path d={CREW_D} fill="none" stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round" />
    </g>
  );
}

const Snow = ({ x, y, s = 1, c = "#F7F5F1" }) => (
  <g transform={`translate(${x} ${y}) scale(${s})`} stroke={c} strokeWidth="1.6" strokeLinecap="round">
    <path d="M0 -8 V8 M-7 -4 L7 4 M-7 4 L7 -4" /><path d="M-2 -6 L0 -8 L2 -6 M-2 6 L0 8 L2 6" fill="none" />
  </g>
);
const Pumpkin = ({ x, y }) => (
  <g transform={`translate(${x} ${y})`}>
    <ellipse cx="0" cy="0" rx="11" ry="9" fill="#1F1D1B" opacity=".85" />
    <path d="M-4 -2 l2 -3 l2 3 z M2 -2 l2 -3 l2 3 z M-5 3 q5 4 10 0" fill="#E9A15A" />
  </g>
);

function Art({ p, color, size = "card" }) {
  const hex = COLORS[color || p.colors[0]].hex;
  const alt = COLORS[p.colors[1] || p.colors[0]].hex;
  const label = `${p.name} en ${COLORS[color || p.colors[0]].name}`;
  let body;
  switch (p.art) {
    case "tabi": body = <Tabi hex={hex} />; break;
    case "crew": body = <Crew hex={hex} stripe={alt !== hex ? alt : "#23211E"} />; break;
    case "pack": body = <g><Crew hex={alt} dx={-34} dy={6} stripe={hex} /><Crew hex={hex} dx={34} dy={6} stripe={alt} /><Crew hex={hex} dy={-6} stripe={alt} /></g>; break;
    case "xmas": body = <Crew hex={hex} stripe="#F7F5F1" motif={<g>{[[96, 90], [124, 112], [100, 136], [126, 158], [92, 176], [150, 206], [118, 210]].map(([x, y], i) => <Snow key={i} x={x} y={y} s={i % 2 ? .8 : 1} />)}<rect x="70" y="72" width="80" height="6" fill={alt} /></g>} />; break;
    case "pumpkin": body = <Crew hex={hex} stripe="#1F1D1B" motif={<g>{[[98, 96], [126, 128], [98, 160], [150, 208], [104, 208]].map(([x, y], i) => <Pumpkin key={i} x={x} y={y} />)}</g>} />; break;
    case "licensed": body = <Crew hex={hex} stripe={alt !== hex ? alt : "#23211E"} motif={<g><circle cx="110" cy="120" r="22" fill="none" stroke={lightOf(hex)} strokeOpacity=".5" strokeWidth="2" /><path d="M100 120 h20 M110 110 v20" stroke={lightOf(hex)} strokeOpacity=".5" strokeWidth="2" /></g>} />; break;
    case "beanie": body = (
      <g>
        <path d="M52 150 C52 82 80 52 110 52 C140 52 168 82 168 150 Z" fill={hex} stroke="var(--ink)" strokeWidth="2" />
        {[0, 1, 2, 3, 4, 5, 6, 7].map((i) => <path key={i} d={`M${66 + i * 13} 150 C${66 + i * 13} 110 ${80 + i * 8} 80 ${82 + i * 8} 66`} fill="none" stroke={lightOf(hex)} strokeOpacity=".2" />)}
        <rect x="46" y="146" width="128" height="38" fill={hex} stroke="var(--ink)" strokeWidth="2" />
        {Array.from({ length: 15 }).map((_, i) => <line key={i} x1={54 + i * 8} y1="150" x2={54 + i * 8} y2="180" stroke={lightOf(hex)} strokeOpacity=".22" />)}
        <circle cx="110" cy="44" r="14" fill={alt} stroke="var(--ink)" strokeWidth="2" />
      </g>); break;
    case "gloves": body = (
      <g>
        {[[-30, -8], [30, 8]].map(([dx, rot], k) => (
          <g key={k} transform={`translate(${110 + dx} 130) rotate(${rot})`}>
            <path d="M-30 70 V-10 C-30 -22 -22 -24 -20 -14 V-40 C-20 -50 -10 -50 -10 -40 V-50 C-10 -60 0 -60 0 -50 V-44 C0 -54 10 -54 10 -44 V-30 C10 -38 20 -38 20 -28 V10 L30 -4 C36 -12 46 -6 40 4 L22 40 V70 Z" fill={k ? alt : hex} stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round" />
            <rect x="-30" y="56" width="52" height="14" fill="rgba(0,0,0,.12)" />
          </g>))}
      </g>); break;
    case "scarf": body = (
      <g>
        <path d="M60 40 C90 30 130 30 160 40 L150 80 C125 72 95 72 70 80 Z" fill={hex} stroke="var(--ink)" strokeWidth="2" />
        <path d="M120 74 L150 80 L142 214 L112 214 Z" fill={hex} stroke="var(--ink)" strokeWidth="2" />
        <path d="M70 80 L100 74 L92 196 L62 196 Z" fill={alt} stroke="var(--ink)" strokeWidth="2" />
        {[0, 1, 2, 3].map((i) => <line key={i} x1={116 + i * 8} y1="214" x2={115 + i * 8} y2="230" stroke="var(--ink)" strokeWidth="1.5" />)}
        {[0, 1, 2, 3].map((i) => <line key={`b${i}`} x1={66 + i * 8} y1="196" x2={65 + i * 8} y2="212" stroke="var(--ink)" strokeWidth="1.5" />)}
      </g>); break;
    case "cap": body = (
      <g>
        <path d="M50 150 C50 92 78 66 116 66 C152 66 176 94 176 150 Z" fill={hex} stroke="var(--ink)" strokeWidth="2" />
        <path d="M113 66 V150 M80 76 C92 100 96 124 96 150 M148 76 C138 100 134 124 134 150" stroke={lightOf(hex)} strokeOpacity=".3" fill="none" />
        <path d="M44 150 H178 C190 150 200 162 196 172 C150 178 80 176 44 166 Z" fill={alt} stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round" />
        <circle cx="114" cy="64" r="5" fill={hex} stroke="var(--ink)" strokeWidth="2" />
      </g>); break;
    case "glasses": body = (
      <g stroke="var(--ink)" strokeWidth="2.4" fill="none">
        <path d="M30 108 H190" />
        <path d="M40 104 C40 150 96 156 98 112 V104 Z" fill={hex} fillOpacity=".9" />
        <path d="M122 104 V112 C124 156 180 150 180 104 Z" fill={hex} fillOpacity=".9" />
        <path d="M98 108 C104 100 116 100 122 108" />
        <path d="M54 118 C60 112 68 110 76 112" stroke="#F7F5F1" strokeOpacity=".5" />
      </g>); break;
    case "sleeves": body = (
      <g>
        {[-26, 26].map((dx, k) => (
          <g key={k} transform={`translate(${110 + dx} 0)`}>
            <path d="M-22 40 H22 L18 210 H-18 Z" fill={k ? alt : hex} stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round" />
            <rect x="-22" y="40" width="44" height="14" fill="rgba(0,0,0,.1)" />
            <rect x="-18" y="196" width="36" height="14" fill="rgba(0,0,0,.1)" />
          </g>))}
      </g>); break;
    default: body = null;
  }
  return <svg viewBox="0 0 220 250" className="w-full h-full" role="img" aria-label={label}>{body}</svg>;
}

/* ---------------- UI básica ---------------- */
const Icon = {
  search: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" {...p}><circle cx="11" cy="11" r="6.5" /><path d="M20 20l-4.2-4.2" /></svg>,
  bag: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" {...p}><path d="M5.5 8.5h13l-1 11.5h-11z" /><path d="M9 8.5c0-2.5 1.3-4 3-4s3 1.5 3 4" /></svg>,
  user: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" {...p}><circle cx="12" cy="8.5" r="3.5" /><path d="M5 20c1.2-3.6 4-5.3 7-5.3s5.8 1.7 7 5.3" /></svg>,
  arrow: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" {...p}><path d="M5 12h14M13 6l6 6-6 6" /></svg>,
  back: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" {...p}><path d="M19 12H5M11 6l-6 6 6 6" /></svg>,
};

function Price({ p, date, big }) {
  const pr = pricing(p, date);
  return (
    <span className={`tnum flex items-baseline gap-2 flex-wrap ${big ? "text-[26px]" : "text-[15px]"}`}>
      <span className={pr.off ? "font-medium" : ""} style={pr.off ? { color: "var(--ocre-ink)" } : null}>{money(pr.price)}</span>
      {pr.off && <s className={`text-inks ${big ? "text-[16px]" : "text-[12.5px]"}`}>{money(p.price)}</s>}
    </span>
  );
}

function Card({ p, date, go, showLine }) {
  const pr = pricing(p, date);
  const col = COLLECTIONS[p.collection];
  const isSokko = p.line === "sokko";
  return (
    <a href={`#p-${p.slug}`} onClick={(e) => { e.preventDefault(); go(`p-${p.slug}`); }} className="group flex flex-col gap-3 min-w-0">
      <div className={`relative aspect-[4/5] max-w-full flex items-center justify-center p-6 transition-colors ${isSokko ? "bg-sand linen-tex group-hover:bg-sand2" : "bg-[#EEE9E2] group-hover:bg-sand"}`}>
        <div className="w-[78%] h-[86%] transition-transform duration-300 group-hover:-translate-y-1"><Art p={p} /></div>
        <div className="absolute top-3 left-3 flex flex-col items-start gap-1.5">
          {pr.off && <span className="tag tag-off">Fuera de temporada · −{pr.pct} %</span>}
          {!pr.off && col && col.kind === "temporada" && <span className="tag tag-season">{col.name}</span>}
        </div>
        {isSokko && <span className="absolute bottom-3 right-3 jp text-[15px] text-inks">{p.jp}</span>}
      </div>
      <div className="flex flex-col gap-1 min-w-0">
        <div className="flex items-center justify-between gap-2">
          <span className="eyebrow truncate">{showLine ? LINES[p.line].name : p.brand === "Sin marca" ? TYPES[p.type] : p.brand}</span>
          {p.stock <= FEW && <span className="tag tag-few">Quedan {p.stock}</span>}
        </div>
        <span className={isSokko ? "serif text-[21px] leading-tight" : "text-[15px] font-normal leading-snug"}>{p.name}</span>
        <span className="flex items-baseline justify-between gap-2">
          <Price p={p} date={date} />
          <span className="text-[12px] text-inks">{unitLabel(p)}</span>
        </span>
      </div>
    </a>
  );
}

function Grid({ items, date, go, showLine, cols = "lg:grid-cols-4" }) {
  return <div className={`grid grid-cols-2 ${cols} gap-x-4 gap-y-10 md:gap-x-6`}>{items.map((p) => <Card key={p.slug} p={p} date={date} go={go} showLine={showLine} />)}</div>;
}

function SectionHead({ eyebrow, title, action, serif }) {
  return (
    <div className="flex items-end justify-between gap-4 mb-8 flex-wrap">
      <div className="flex flex-col gap-2 min-w-0">
        <span className="eyebrow">{eyebrow}</span>
        <h2 className={serif ? "serif text-[34px] md:text-[42px] font-light leading-none" : "text-[24px] md:text-[28px] font-light leading-tight"}>{title}</h2>
      </div>
      {action}
    </div>
  );
}

          <span className="w-11 h-11 grid place-items-center" aria-label="Mi cuenta"><Icon.user className="w-[21px] h-[21px]" /></span>

/* ---------------- Inicio ---------------- */

  const marcas = PRODUCTS.filter((p) => p.line === "marcas");

  const counts = Object.fromEntries(Object.keys(LINES).map((k) => [k, PRODUCTS.filter((p) => p.line === k && visible(p, date)).length]));

      {/* Marcas */}
      <section className="gutter py-14 md:py-20">
        <SectionHead eyebrow="Originales con factura del proveedor" title="Marcas favoritas"
          action={<div className="flex gap-2 flex-wrap">{["Nike", "Puma", "Under Armour"].map((b) => <a key={b} href="#linea-marcas" onClick={(e) => { e.preventDefault(); go("linea-marcas", { brand: b }); }} className="chip">{b}</a>)}</div>} />
        <Grid items={marcas} date={date} go={go} />
      </section>

      {/* Accesorios */}
      <section className="border-t hairline">
        <div className="gutter py-14 md:py-20">
          <SectionHead eyebrow="Accesorios · todo el año" title="Completa tu look"
            action={<a href="#linea-accesorios" onClick={(e) => { e.preventDefault(); go("linea-accesorios"); }} className="navlink flex items-center gap-2">Ver accesorios <Icon.arrow className="w-4 h-4" /></a>} />
          <Grid items={acc} date={date} go={go} />
        </div>
      </section>

      <ShipBand />
    </main>
  );
}

function ShipBand() {
  return (
    <section className="bg-ink text-linen">
      <div className="gutter py-8 grid sm:grid-cols-3 gap-6 text-[13px]">
        <p><span className="block eyebrow !text-sand2 mb-1">Envío gratis</span>En compras desde {money(FREE_SHIPPING)}, en cualquier línea.</p>
        <p><span className="block eyebrow !text-sand2 mb-1">Entrega local</span>Los Mochis y ejidos vecinos por {money(49)}.</p>
        <p><span className="block eyebrow !text-sand2 mb-1">Pago</span>Tarjeta u OXXO Pay. IVA incluido.</p>
      </div>
    </section>
  );
}

/* ---------------- Listado por línea ---------------- */
function LinePage({ line, date, go, params }) {
  const L = LINES[line];
  const all = PRODUCTS.filter((p) => p.line === line && visible(p, date));
  const hiddenCount = PRODUCTS.filter((p) => p.line === line && !visible(p, date)).length;
  const facets = useMemo(() => {
    if (line === "marcas") return { key: "brand", label: "Marca", opts: [...new Set(all.map((p) => p.brand))].filter((b) => BRANDS_IN_FILTER.includes(b)) };
    if (line === "especiales") return { key: "collection", label: "Colección", opts: [...new Set(all.map((p) => p.collection))], name: (c) => COLLECTIONS[c].name };
    if (line === "accesorios") return { key: "type", label: "Tipo", opts: [...new Set(all.map((p) => p.type))], name: (t) => TYPES[t] };
    return { key: "color", label: "Tono", opts: ["SUM", "WAS", "LAC", "MAT"], name: (c) => COLORS[c].name };
  }, [line, date.id]);
  const [f, setF] = useState(params && params[facets.key] ? params[facets.key] : null);
  useEffect(() => { setF(params && params[facets.key] ? params[facets.key] : null); }, [line]);
  const items = all.filter((p) => !f || (facets.key === "color" ? p.colors.includes(f) : p[facets.key] === f));
  const isSokko = line === "sokko";

  return (
    <main className="fade">
      <section className={`border-b hairline ${isSokko ? "linen-tex" : ""}`}>
        <div className="gutter py-10 md:py-14 flex items-end justify-between gap-6 flex-wrap">
          <div className="flex flex-col gap-3 min-w-0">
            <span className="eyebrow">{isSokko ? "La colección de la casa" : "Línea"}</span>
            <h1 className={isSokko ? "serif font-light text-[48px] md:text-[64px] leading-none flex items-baseline gap-4" : "text-[34px] md:text-[44px] font-light leading-none"}>
              {L.name}{L.jp && <span className="jp text-[24px] text-laca">{L.jp}</span>}
            </h1>
            <p className="text-inks text-[15px] max-w-[52ch]">{L.blurb}</p>
          </div>
          <span className="text-[13px] text-inks tnum">{items.length} de {all.length} productos</span>
        </div>
      </section>
      <section className="gutter py-6 border-b hairline">
        <div className="flex items-center gap-3 scroll-x">
          <span className="eyebrow shrink-0 mr-1">{facets.label}</span>
          <button type="button" className="chip" aria-pressed={!f} onClick={() => setF(null)}>Todos</button>
          {facets.opts.map((o) => (
            <button key={o} type="button" className="chip" aria-pressed={f === o} onClick={() => setF(f === o ? null : o)}>
              {facets.key === "color" && <span className="w-3 h-3 rounded-full border hairline" style={{ background: COLORS[o].hex }} />}
              {facets.name ? facets.name(o) : o}
            </button>
          ))}
        </div>
      </section>
      <section className="gutter py-10 md:py-14 flex flex-col gap-10">
        <Grid items={items} date={date} go={go} />
        {line === "especiales" && hiddenCount > 0 && (
          <p className="text-[13px] text-inks border-t hairline pt-6 max-w-[70ch]">
            Hay {hiddenCount} {hiddenCount === 1 ? "producto" : "productos"} de temporadas que no están activas. No aparecen aquí, pero los encuentras con el <a href="#buscar" onClick={(e) => { e.preventDefault(); go("buscar", { q: "navidad" }); }} className="underline underline-offset-4 text-ink">buscador</a>, con descuento.
          </p>
        )}
      </section>
    </main>
  );
}

/* ---------------- Búsqueda ---------------- */
const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function SearchPage({ date, go, params }) {
  const [q, setQ] = useState(params && params.q != null ? params.q : "navidad");
  const results = useMemo(() => {
    const n = norm(q.trim());
    if (!n) return [];
    return PRODUCTS.filter((p) => norm([p.name, p.brand, LINES[p.line].name, TYPES[p.type], p.collection ? COLLECTIONS[p.collection].name : "", p.note].join(" ")).includes(n));
  }, [q]);
  const offCount = results.filter((p) => pricing(p, date).off).length;
  const suggestions = ["navidad", "halloween", "nike", "guantes", "tabi", "pokemon"];
  return (
    <main className="fade gutter py-10 md:py-14 flex flex-col gap-8">
      <form role="search" onSubmit={(e) => e.preventDefault()} className="flex flex-col gap-4">
        <label htmlFor="q" className="eyebrow">Buscar en las cuatro líneas</label>
        <div className="flex items-center gap-3 border-b border-ink pb-2 max-w-[720px]">
          <Icon.search className="w-6 h-6 shrink-0" />
          <input id="q" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Calcetas, marcas, accesorios…" autoComplete="off"
                 className="flex-1 min-w-0 bg-transparent outline-none text-[24px] md:text-[30px] font-light placeholder:text-inks/60" />
        </div>
        <div className="flex gap-2 flex-wrap">{suggestions.map((s) => <button key={s} type="button" className="chip" aria-pressed={norm(q) === s} onClick={() => setQ(s)}>{s}</button>)}</div>
      </form>
      <div className="flex items-baseline justify-between gap-4 flex-wrap border-b hairline pb-4">
        <p className="text-[14px] text-inks tnum">{results.length} {results.length === 1 ? "resultado" : "resultados"}{q.trim() ? ` para “${q.trim()}”` : ""}</p>
        {offCount > 0 && <p className="text-[13px] flex items-center gap-2"><span className="tag tag-off">−30 %</span>{offCount} fuera de temporada, con descuento</p>}
      </div>
      {results.length ? <Grid items={results} date={date} go={go} showLine /> : (
        <div className="py-16 flex flex-col items-start gap-4 max-w-[52ch]">
          <p className="serif text-[28px] font-light">Sin resultados para “{q}”.</p>
          <p className="text-inks">Prueba con el nombre de una marca, una temporada o un tipo de prenda.</p>
        </div>
      )}
    </main>
  );
}

/* ---------------- Ficha ---------------- */
function ProductPage({ slug, date, go, add }) {
  const p = PRODUCTS.find((x) => x.slug === slug) || PRODUCTS[0];
  const [color, setColor] = useState(p.colors[0]);
  const sizes = SIZES[p.size];
  const [size, setSize] = useState(sizes.length === 1 ? sizes[0][0] : null);
  const [err, setErr] = useState(false);
  useEffect(() => { setColor(p.colors[0]); setSize(SIZES[p.size].length === 1 ? SIZES[p.size][0][0] : null); setErr(false); }, [slug]);
  const pr = pricing(p, date);
  const col = COLLECTIONS[p.collection];
  const isSokko = p.line === "sokko";
  const related = PRODUCTS.filter((x) => x.line === "accesorios" && x.slug !== p.slug).slice(0, 4);
  const sku = `${{ sokko: "SKK", marcas: "MRC", especiales: "ESP", accesorios: "ACC" }[p.line]}-${String(PRODUCTS.indexOf(p) + 1).padStart(3, "0")}-${color}-${size || "?"}`;

  return (
    <main className="fade">
      <div className="gutter pt-6">
        <nav aria-label="Ruta" className="flex items-center gap-2 text-[12px] text-inks flex-wrap">
          <a href="#inicio" onClick={(e) => { e.preventDefault(); go("inicio"); }} className="hover:text-ink">Inicio</a><span>/</span>
          <a href={`#linea-${p.line}`} onClick={(e) => { e.preventDefault(); go(`linea-${p.line}`); }} className="hover:text-ink">{LINES[p.line].name}</a><span>/</span>
          <span className="text-ink truncate">{p.name}</span>
        </nav>
      </div>
      <section className="gutter py-8 md:py-12 grid md:grid-cols-[1.1fr_1fr] gap-8 md:gap-14 items-start">
        <div className={`relative aspect-[4/5] max-w-full flex items-center justify-center ${isSokko ? "bg-sand linen-tex" : "bg-[#EEE9E2]"}`}>
          <div className="w-[70%] h-[80%]"><Art p={p} color={color} /></div>
          {pr.off && <span className="tag tag-off absolute top-4 left-4">Fuera de temporada · −{pr.pct} %</span>}
          {isSokko && <span className="absolute top-6 right-6 vertical jp text-[20px] tracking-[.3em] text-inks">{p.jp}</span>}
        </div>
        <div className="flex flex-col gap-7 min-w-0">
          <div className="flex flex-col gap-3">
            <span className="eyebrow flex items-center gap-2 flex-wrap">
              {isSokko && <span className="w-1.5 h-1.5 rounded-full bg-laca" />}
              {LINES[p.line].name}{p.brand !== "Sin marca" && p.brand !== "SOKKO" ? ` · ${p.brand}` : ""}{col ? ` · ${col.name}` : ""}
            </span>
            <h1 className={isSokko ? "serif font-light text-[44px] md:text-[54px] leading-[1.02]" : "text-[30px] md:text-[38px] font-light leading-tight"}>{p.name}</h1>
            <p className="text-inks text-[15px]">{p.note}</p>
          </div>

          <div className="flex flex-col gap-2 border-y hairline py-5">
            <div className="flex items-baseline justify-between gap-4 flex-wrap">
              <Price p={p} date={date} big />
              <span className="text-[13px] text-inks">{unitLabel(p)} · IVA incluido</span>
            </div>
            {pr.off && <p className="text-[13px] leading-snug" style={{ color: "var(--ocre-ink)" }}>La temporada de {col.name} ({fmtWindow(col)}) no está activa. Este producto tiene {pr.pct} % de descuento mientras tanto.</p>}
            {!pr.off && col && col.kind === "temporada" && <p className="text-[13px] text-matcha">Temporada de {col.name} activa hasta el {col.end[1]} de {["", "enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"][col.end[0]]}.</p>}
          </div>

          <fieldset className="flex flex-col gap-3">
            <legend className="eyebrow mb-3">{isSokko ? "Tono" : "Color"} · <span className="normal-case tracking-normal text-ink">{COLORS[color].name}</span></legend>
            <div className="flex gap-3 flex-wrap">
              {p.colors.map((c) => (
                <button key={c} type="button" onClick={() => setColor(c)} aria-pressed={color === c} aria-label={COLORS[c].name}
                        className={`w-10 h-10 rounded-full border-2 transition ${color === c ? "border-ink" : "border-transparent"}`}>
                  <span className="block w-full h-full rounded-full border hairline" style={{ background: COLORS[c].hex }} />
                </button>
              ))}
            </div>
          </fieldset>

          <fieldset className="flex flex-col gap-3">
            <legend className="eyebrow mb-3">Talla {p.size === "guante" && <span className="normal-case tracking-normal">(guante)</span>}</legend>
            {sizes.length === 1 ? (
              <p className="text-[14px] flex items-center gap-2"><span className="chip" aria-pressed="true">U</span> Talla única</p>
            ) : (
              <div className="grid grid-cols-3 gap-2 max-w-[420px]">
                {sizes.map(([s, cm]) => (
                  <button key={s} type="button" onClick={() => { setSize(s); setErr(false); }} aria-pressed={size === s} aria-describedby={err ? "size-err" : undefined}
                          className={`flex flex-col items-center justify-center min-h-[56px] border transition ${size === s ? "bg-ink text-linen border-ink" : "hairline hover:border-ink"}`}>
                    <span className="text-[15px]">{s}</span><span className={`text-[11px] ${size === s ? "text-sand2" : "text-inks"}`}>{cm}</span>
                  </button>
                ))}
              </div>
            )}
            {err && <p id="size-err" role="alert" className="text-[13px] text-laca">Elige una talla para agregar a tu bolsa.</p>}
          </fieldset>

          <div className="flex flex-col gap-3">
            <button type="button" className="btn btn-laca w-full" onClick={() => { if (!size) { setErr(true); return; } add(p, pr.price); }}>
              Agregar a la bolsa · {money(pr.price)}
            </button>
            <p className="text-[12.5px] text-inks flex justify-between gap-3 flex-wrap tnum">
              <span>{p.stock <= FEW ? <span className="text-laca">Quedan {p.stock} {p.type === "calcetas" && !p.pack ? (p.stock === 1 ? "par" : "pares") : (p.stock === 1 ? "unidad" : "unidades")}</span> : "Disponible"}</span>
              <span>SKU {sku}</span>
            </p>
          </div>

          {p.line === "especiales" && p.brand !== "Sin marca" && <p className="text-[12.5px] text-inks border-l-2 border-moss pl-3">Producto con licencia oficial {p.brand}. Comprado a distribuidor autorizado.</p>}
          {p.line === "marcas" && <p className="text-[12.5px] text-inks border-l-2 border-moss pl-3">Original {p.brand}, con factura del proveedor.</p>}
        </div>
      </section>

      {p.line !== "accesorios" && (
        <section className="border-t hairline">
          <div className="gutter py-14">
            <SectionHead eyebrow="Accesorios · todo el año" title="Completa tu look" />
            <Grid items={related} date={date} go={go} />
          </div>
        </section>
      )}
    </main>
  );
}

/* ---------------- Pie ---------------- */
function Footer({ go }) {
  return (
    <footer className="border-t hairline">
      <div className="gutter py-12 grid gap-10 md:grid-cols-[1fr_2fr]">
        <img src={ISOTIPO} alt="SOKKO" className="h-20 w-auto self-start" />
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-6 text-[13px]">
          {Object.entries(LINES).map(([k, l]) => (
            <div key={k} className="flex flex-col gap-2">
              <a href={`#linea-${k}`} onClick={(e) => { e.preventDefault(); go(`linea-${k}`); }} className="eyebrow hover:text-ink">{l.name}</a>
              {PRODUCTS.filter((p) => p.line === k).slice(0, 3).map((p) => <a key={p.slug} href={`#p-${p.slug}`} onClick={(e) => { e.preventDefault(); go(`p-${p.slug}`); }} className="text-inks hover:text-ink truncate">{p.name}</a>)}
            </div>
          ))}
        </div>
      </div>
      <div className="gutter py-5 border-t hairline text-[12px] text-inks flex justify-between gap-4 flex-wrap">
        <span>© 2026 SOKKO · Los Mochis, Sinaloa</span><span>Visa · Mastercard · American Express · OXXO Pay</span>
      </div>
    </footer>
  );
}

/* ---------------- Panel del mockup ---------------- */
function MockPanel({ date, setDate, route, go }) {
  const [open, setOpen] = useState(typeof window !== "undefined" && window.innerWidth >= 768);
  const screens = [["inicio", "Inicio"], ["linea-especiales", "Especiales"], ["buscar", "Búsqueda"], ["p-nike-everyday-cushion-3", "Ficha: paquete"], ["p-copo-navideno", "Ficha: temporada"], ["p-guantes-tactiles", "Ficha: guante"]];
  return (
    <aside className="fixed z-50 bg-white/95 backdrop-blur border hairline shadow-[0_10px_30px_rgba(35,33,30,.12)] text-[12.5px] w-[min(300px,calc(100vw-32px))]"
           style={{ right: "calc(16px + env(safe-area-inset-right, 0px))", bottom: "calc(16px + env(safe-area-inset-bottom, 0px))" }} aria-label="Controles del mockup">
      <button type="button" onClick={() => setOpen(!open)} className="w-full flex items-center justify-between px-4 h-11 eyebrow !text-ink" aria-expanded={open}>
        Mockup · simular <span aria-hidden="true">{open ? "–" : "+"}</span>
      </button>
      {open && (
        <div className="px-4 pb-4 flex flex-col gap-4 border-t hairline pt-3">
          <div className="flex flex-col gap-2">
            <span className="text-inks">Fecha de hoy (R-28 / R-29)</span>
            <div className="flex gap-1.5 flex-wrap">{DATES.map((d) => <button key={d.id} type="button" className="chip !min-h-[32px] !px-2.5 !text-[12px]" aria-pressed={date.id === d.id} onClick={() => setDate(d)}>{d.label}</button>)}</div>
            <span className="text-inks leading-snug">
              {Object.values(COLLECTIONS).filter((c) => c.kind === "temporada").map((c) => `${c.name}: ${inSeason(c, date) ? "activa" : "fuera"}`).join(" · ")}
            </span>
          </div>
          <div className="flex flex-col gap-2">
            <span className="text-inks">Ir a pantalla</span>
            <div className="flex gap-1.5 flex-wrap">{screens.map(([r, l]) => <button key={r} type="button" className="chip !min-h-[32px] !px-2.5 !text-[12px]" aria-pressed={route === r} onClick={() => go(r, r === "buscar" ? { q: "navidad" } : undefined)}>{l}</button>)}</div>
          </div>
        </div>
      )}
    </aside>
  );
}

/* ---------------- App ---------------- */
function App() {
  const read = () => (location.hash || "#inicio").slice(1) || "inicio";
  const [route, setRoute] = useState(read());
  const [params, setParams] = useState(null);
  const [date, setDate] = useState(DATES[0]);
  const [cart, setCart] = useState(2);
  const [toast, setToast] = useState(null);
  useEffect(() => { const h = () => { setRoute(read()); }; addEventListener("hashchange", h); return () => removeEventListener("hashchange", h); }, []);
  const go = (r, prm) => { setParams(prm || null); if (location.hash.slice(1) !== r) location.hash = r; setRoute(r); window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" }); };
  const add = (p, price) => { setCart((c) => c + 1); setToast(`${p.name} agregado · ${money(price)}`); clearTimeout(window.__t); window.__t = setTimeout(() => setToast(null), 2600); };

  let view;
  if (route.startsWith("linea-") && LINES[route.slice(6)]) view = <LinePage line={route.slice(6)} date={date} go={go} params={params} />;
  else if (route === "buscar") view = <SearchPage key={params ? params.q : "s"} date={date} go={go} params={params} />;
  else if (route.startsWith("p-")) view = <ProductPage slug={route.slice(2)} date={date} go={go} add={add} />;
  else view = <Home date={date} go={go} />;

  return (
    <div className="min-h-full flex flex-col">
      <Header route={route} go={go} cart={cart} />
      <div className="flex-1" key={route + date.id}>{view}</div>
      <Footer go={go} />
      <MockPanel date={date} setDate={setDate} route={route} go={go} />
      {toast && (
        <div role="status" className="toast fixed z-50 bg-ink text-linen px-5 py-3 text-[13px]" style={{ left: "calc(16px + env(safe-area-inset-left, 0px))", bottom: "calc(16px + env(safe-area-inset-bottom, 0px))", maxWidth: "calc(100vw - 32px)" }}>{toast}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
