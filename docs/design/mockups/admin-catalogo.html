<title>SOKKO Panel Catálogo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Shippori+Mincho:wght@500&display=swap">
<style>
  /* Layout: work mode of Kyoto Artisan (same shell as the production admin panel). Sand sidebar + linen workspace,
     dense tables, Work Sans first, serif only for page titles. Ai blue = data and focus; laca = primary action and critical.
     New here: catalog by line (SOKKO / Marcas / Especiales / Accesorios), brands, recurring season windows, cost and margin (Dueño only). */
  :root {
    --linen: #F4F0EB; --paper: #FFFFFF; --sand: #ECE5DC; --sand-2: #E3DACD; --line: #DDD5CA;
    --ink: #23211E; --ink-soft: #6A645C; --laca: #A62B2B; --laca-hover: #8F2424; --matcha: #5A6654;
    --ai: #2F5E9E; --ocre: #B07A3C; --ocre-ink: #85571F;
    --ok-bg: #E7ECE3; --warn-bg: #F4E7D3; --crit-bg: #F3DEDB; --info-bg: #E3E9F2;
    --font-sans: "Work Sans", "Helvetica Neue", system-ui, sans-serif;
    --font-serif: "Cormorant Garamond", Garamond, "Times New Roman", serif;
    --font-jp: "Shippori Mincho", "Yu Mincho", serif;
    color-scheme: light;
  }
  html, body { background: var(--linen); color: var(--ink); }
  body { font-family: var(--font-sans); font-size: 14px; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--linen); }
  .serif { font-family: var(--font-serif); }
  .jp { font-family: var(--font-jp); }
  .tnum { font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
  h1, h2, h3 { text-wrap: balance; }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  @media (min-width: 1024px) { .gutter { padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
  .fld { height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); width: 100%; font-size: 13.5px; color: var(--ink); }
  .fld:focus { outline: 2px solid var(--ai); outline-offset: 0; border-color: var(--ai); }
  .fld[aria-invalid="true"] { border-color: var(--laca); }
  .lbl { font-size: 12px; color: var(--ink-soft); font-weight: 500; }
  .btn { height: 38px; padding: 0 14px; border-radius: 6px; font-size: 13.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .btn-pri { background: var(--laca); color: #fff; } .btn-pri:hover { background: var(--laca-hover); }
  .btn-sec { background: var(--paper); border: 1px solid var(--line); color: var(--ink); } .btn-sec:hover { border-color: var(--ink-soft); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); padding: 2px; gap: 2px; }
  .seg button { height: 30px; padding: 0 10px; border-radius: 4px; font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--linen); }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
  .p-ok { background: var(--ok-bg); color: #3F4A3A; } .p-warn { background: var(--warn-bg); color: #6E4A1B; }
  .p-crit { background: var(--crit-bg); color: #8A2323; } .p-info { background: var(--info-bg); color: #24497C; } .p-mute { background: var(--sand); color: var(--ink-soft); }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { text-align: left; font-weight: 500; font-size: 11.5px; letter-spacing: .04em; color: var(--ink-soft); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--paper); }
  .tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tbody tr:hover { background: #FBF9F6; }
  .tbl tbody tr:last-child td { border-bottom: 0; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .switch { width: 36px; height: 20px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; flex: none; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch[aria-checked="true"] { background: var(--matcha); }
  .switch[aria-checked="true"]::after { transform: translateX(16px); }
  .switch:disabled { opacity: .55; }
  .fade { animation: fade .3s ease both; }
  @keyframes fade { from { opacity: .001; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .slide { animation: slide .3s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes slide { from { transform: translateX(24px); opacity: .001; } to { transform: none; opacity: 1; } }
  :focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  #root:empty::after { content: "Cargando panel…"; display: block; padding: 48px 16px; color: var(--ink-soft); }
</style>

const key = (m, d) => m * 100 + d;
function inSeason(c, m = TODAY.m, d = TODAY.d) {
  if (!c || c.kind !== "temporada") return true;
  const t = key(m, d), s = key(c.sm, c.sd), e = key(c.em, c.ed);
  return s <= e ? t >= s && t <= e : t >= s || t <= e;
}
const dayOfYear = (m, d) => DIM.slice(0, m - 1).reduce((a, b) => a + b, 0) + d; // año sin bisiesto (29-feb no se acepta)
function daysUntil(m, d) { const a = dayOfYear(TODAY.m, TODAY.d), b = dayOfYear(m, d); return (b - a + 365) % 365; }
const fmtWin = (c) => `${c.sd} ${MONTHS[c.sm - 1]} – ${c.ed} ${MONTHS[c.em - 1]}`;
function seasonState(c) {
  if (c.kind !== "temporada") return { pill: "p-info", text: "Siempre visible" };
  if (inSeason(c)) { const n = daysUntil(c.em, c.ed); return { pill: "p-ok", text: n === 0 ? "Activa · termina hoy" : `Activa · termina en ${n} ${n === 1 ? "día" : "días"}` }; }
  const n = daysUntil(c.sm, c.sd);
  return { pill: n <= 14 ? "p-warn" : "p-mute", text: `Fuera · inicia en ${n} ${n === 1 ? "día" : "días"}` };
}
const unitOf = (p, types) => p.pack > 1 ? `Paquete de ${p.pack}` : (types.find((t) => t.code === p.type)?.unit === "par" ? "Par" : "Pieza");

/* ================= Colecciones ================= */
function YearBar({ c }) {
  const W = 100 / 365;
  const segs = [];
  if (c.kind === "temporada") {
    const s = dayOfYear(c.sm, c.sd), e = dayOfYear(c.em, c.ed);
    if (s <= e) segs.push([s, e]); else { segs.push([s, 365]); segs.push([1, e]); }
  }
  const today = dayOfYear(TODAY.m, TODAY.d);
  return (
    <div className="flex flex-col gap-1.5" aria-hidden="true">
      <div className="relative h-8 rounded-sm bg-linen border border-line overflow-hidden">
        {segs.map(([a, b], i) => <span key={i} className="absolute inset-y-0 bg-matcha/80" style={{ left: `${(a - 1) * W}%`, width: `${(b - a + 1) * W}%` }} />)}
        {MONTHS.map((_, i) => i > 0 && <span key={i} className="absolute inset-y-0 w-px bg-line" style={{ left: `${(dayOfYear(i + 1, 1) - 1) * W}%` }} />)}
        <span className="absolute -inset-y-0 w-0.5 bg-laca" style={{ left: `${(today - 1) * W}%` }} />
      </div>
      <div className="relative h-4 text-[10.5px] text-inks">
        {MONTHS.map((m, i) => <span key={m} className="absolute" style={{ left: `${(dayOfYear(i + 1, 1) - 1) * W}%` }}>{i % 2 === 0 ? m : ""}</span>)}
      </div>
    </div>
  );
}

      </div>
      <ul className="p-3 flex flex-col gap-0.5 flex-1 overflow-y-auto">
        {nav.map((n, i) => n.group != null ? (
          <li key={`g${i}`} className={n.group ? "px-3 pt-4 pb-1.5 text-[10.5px] tracking-[.16em] uppercase text-inks" : "my-2 border-t border-line"} aria-hidden={!n.group}>{n.group}</li>
        ) : (
          <li key={n.k}>
            <button type="button" onClick={() => go(n.k)} aria-current={page === n.k ? "page" : undefined}
              className={`w-full h-10 px-3 rounded-md flex items-center gap-3 text-[13.5px] transition-colors ${page === n.k ? "bg-paper text-ink font-medium border border-line" : "text-inks hover:text-ink hover:bg-sand2/60 border border-transparent"}`}>
              <Ico d={n.i} />{n.l}{n.isNew && <span className="ml-auto text-[10px] tracking-[.1em] uppercase text-ai">Nuevo</span>}
            </button>
          </li>
        ))}
      </ul>
      <div className="p-3 border-t border-line"><span className="h-10 px-3 rounded-md flex items-center gap-3 text-[13px] text-inks"><Ico d={I.ext} />Ver tienda</span></div>
    </nav>
  );

  let view;
  if (page === "dashboard") view = <Dashboard role={role} products={products} collections={collections} go={go} />;
  else if (page === "productos") view = <Products role={role} products={products} brands={brands} collections={collections} types={TYPES_INIT} filter={filter} setFilter={setFilter} open={setDrawer} />;
  else if (page === "marcas") view = <Brands role={role} brands={brands} setBrands={setBrands} products={products} toast={toast} />;
  else if (page === "colecciones") view = <Collections role={role} collections={collections} setCollections={setCollections} products={products} toast={toast} />;
  else if (page === "tipos") view = <Types role={role} types={TYPES_INIT} products={products} />;
  else view = <Same name={NAV.find((n) => n.k === page)?.l} />;

  return (
    <div className="min-h-screen lg:grid lg:grid-cols-[248px_minmax(0,1fr)]">
      <aside className="hidden lg:block bg-sand border-r border-line sticky top-0 h-screen" style={{ paddingTop: "env(safe-area-inset-top, 0px)" }}>{Sidebar}</aside>
      {menu && (
        <div className="lg:hidden fixed inset-0 z-50">
          <div className="absolute inset-0 bg-ink/30" onClick={() => setMenu(false)} />
          <aside className="slide absolute inset-y-0 left-0 w-[260px] bg-sand border-r border-line" style={{ paddingTop: "env(safe-area-inset-top, 0px)" }}>{Sidebar}</aside>
        </div>
      )}
      <div className="min-w-0">
        <header className="sticky z-30 bg-linen/95 backdrop-blur border-b border-line" style={{ top: "env(safe-area-inset-top, 0px)" }}>
          <div className="gutter h-16 flex items-center gap-3">
            <button type="button" className="lg:hidden w-10 h-10 -ml-2 rounded-md hover:bg-sand grid place-items-center" onClick={() => setMenu(true)} aria-label="Abrir menú"><Ico d={I.menu} /></button>
            <span className="text-[12.5px] text-inks hidden sm:block">Catálogo multilínea · mockup</span>
            <div className="ml-auto relative">
              <button type="button" onClick={() => setRoleMenu((m) => !m)} aria-haspopup="menu" aria-expanded={roleMenu} className="h-10 pl-1.5 pr-2.5 rounded-md hover:bg-sand flex items-center gap-2.5">
                <span className="w-8 h-8 rounded-full bg-ink text-linen text-[12px] font-semibold grid place-items-center">{ROLES[role].ini}</span>
                <span className="text-left leading-tight"><span className="block text-[13px] font-medium">{ROLES[role].name}</span><span className="block text-[11.5px] text-inks">{ROLES[role].label}</span></span>
                <Ico d={I.down} className="w-4 h-4 text-inks" />
              </button>
              {roleMenu && (
                <div role="menu" className="fade absolute right-0 mt-1 w-64 bg-paper border border-line rounded-lg shadow-lg py-1.5 z-50">
                  <p className="px-3 py-1.5 text-[11.5px] text-inks">Demo: ver el panel como…</p>
                  {Object.entries(ROLES).map(([k, r]) => (
                    <button key={k} type="button" role="menuitemradio" aria-checked={role === k} onClick={() => { setRole(k); setRoleMenu(false); }} className="w-full px-3 py-2 text-left text-[13px] hover:bg-linen flex items-center gap-2">
                      <span className="w-4">{role === k && <Ico d={I.check} className="w-4 h-4 text-ai" />}</span>{r.label}<span className="ml-auto text-[11.5px] text-inks">{r.name}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>
        </header>
        <main className="gutter py-7" key={page + role}>{view}</main>
      </div>
      {drawer && <ProductDrawer id={drawer} role={role} products={products} brands={brands} collections={collections} types={TYPES_INIT} onClose={() => setDrawer(null)} onSave={onSave} />}
      {msg && <div role="status" className="fade fixed z-[60] bg-ink text-linen px-4 py-3 rounded-md text-[13px]" style={{ right: "calc(16px + env(safe-area-inset-right, 0px))", bottom: "calc(16px + env(safe-area-inset-bottom, 0px))", maxWidth: "calc(100vw - 32px)" }}>{msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
