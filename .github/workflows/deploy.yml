# Despliegue de la API a Azure: corre después de que CI pase en un push a main. Entra por OIDC, sin secretos guardados.
# La tienda y el panel los despliega Vercel desde su integración con GitHub (docs/infra/AZURE.md §6).
# Variables del ambiente "production": ver infra/README.md. Sin ellas, el job se salta.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

# Dos despliegues nunca corren a la vez; las migraciones no se interrumpen a medias.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          # El commit que CI aprobó, no lo último de main.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publicar la API
        working-directory: apps/api-service
        run: dotnet publish Sokko.Api.csproj -c Release -o "$RUNNER_TEMP/api"

      - name: Generar el bundle de migraciones
        working-directory: apps/api-service
        env:
          # Solo para armar el bundle en el runner; no se conecta a nada.
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet tool restore
          dotnet ef migrations bundle --project Sokko.Api.csproj --configuration Release --self-contained -r linux-x64 -o "$RUNNER_TEMP/efbundle"

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Antes de publicar: la API nueva nunca corre contra un esquema viejo. En Production no se siembra nada de Development.
      - name: Aplicar las migraciones
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__Sokko: Server=tcp:${{ vars.SQL_SERVER_FQDN }},1433;Database=Sokko;Authentication=Active Directory Default;Encrypt=True;Connection Timeout=120
        run: |
          "$RUNNER_TEMP/efbundle" --connection "$ConnectionStrings__Sokko"

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.API_NAME }}
          package: ${{ runner.temp }}/api
